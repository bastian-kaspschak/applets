<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applets · Kaspschak</title>
<!--
  Startseite des oeffentlichen Repos applets: nur die Liste der Kurse. Die
  Applets selbst stehen auf der index.html des jeweiligen Kursordners
  (11nf-ph/, 12pe1-m/, ...). Ein neuer Kurs bekommt hier einen Eintrag.
  Keine externen Ressourcen, damit die Seite offline funktioniert.
-->
<style>
  :root { --rot: #B01A15; --stahl: #35638A; --oliv: #71803C; --grau: #B5B5B5; --text: #222; --hell: #f5f5f2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color: var(--text); background: #fff; line-height: 1.45; }
  header { border-bottom: 1px solid var(--grau); padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 13px; }
  header .k { color: #777; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; display: block; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 18px 30px; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  h1::after { content: ""; display: block; width: 44px; border-bottom: 2px solid var(--text); margin-top: 6px; }
  p.lead { margin: 12px 0 18px; }
  ul.liste { list-style: none; padding: 0; margin: 0; }
  ul.liste li { border: 1px solid var(--grau); background: var(--hell); padding: 12px 14px; margin: 0 0 10px; }
  ul.liste a { color: var(--stahl); font-weight: 600; font-size: 17px; text-decoration: none; }
  ul.liste a:hover { text-decoration: underline; }
  ul.liste a::after { content: " ›"; color: var(--grau); }
  ul.liste .meta { display: block; color: #777; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
  footer { font-size: 11px; color: #777; padding: 0 18px 12px; }
</style>
</head>
<body>
<header>
  <div><span class="k">Fächer</span>Physik und Mathematik (Kaspschak)</div>
  <div><span class="k">Schule</span>Lore-Lorentz-Schule</div>
</header>
<main>
  <h1>Applets</h1>
  <p class="lead">Kleine interaktive Seiten zum Wiederholen und Üben zu Hause. Wähle deinen Kurs;
    dort stehen die Applets.</p>

  <ul class="liste">
    <li>
      <span class="meta">Physik</span>
      <a href="11nf-ph/">11NF PH</a>
    </li>
    <li>
      <span class="meta">Mathematik</span>
      <a href="12pe1-m/">12PE1 M</a>
    </li>
  </ul>
</main>
<footer>Kaspschak · applets</footer>
</body>
</html>
