<!--
  Applet "Unser Waffelstand", IFK1 M, Lernsituation "Waffeln fuer einen guten Zweck".
  Eine Szene (drei Schultische mit Teig, Waffeleisen, Waffelstapeln und Kasse; dahinter eine Person,
  die backt, und eine, die kassiert; davor die Kundschaft), drei Ansichten:
    Backen      (26.11.)  Anzahl der Waffeln (15 bis 60) -> Teig in Gramm
    Verkaufen   (27.11.)  eine Pause von 20 Minuten, 24 Personen, ein Waffeleisen
    Waffeleisen (03.12.)  Anzahl der Waffeleisen -> Backzeit fuer 24 Waffeln
  Links auf dem Tisch stehen die Teigschuesseln: eine je Rezept (15 Waffeln). Sie werden der
  Reihe nach leer, so schnell wie gebacken wird.
  Mit dem Zusatz #eisen in der Adresse erscheint die dritte Ansicht, und im Verkauf laesst
  sich die Anzahl der Waffeleisen einstellen (Kontrolle am 03.12.). Ohne den Zusatz hat der
  Verkauf ein Waffeleisen und keinen Steller.
  Zahlen wie auf den Arbeitsblaettern: 15 Waffeln = 900 g Teig, 6 EUR Zutaten;
  Preis 1 EUR; 3 Minuten je Waffel.
  Verkauf: Waffeln gibt es nur frisch. Zu Beginn der Pause liegt keine Waffel auf dem Tisch;
  jedes Waffeleisen liefert alle 3 Minuten eine (Minute 3 bis 18, also 6 je Pause).
  24 Personen kommen gleichmaessig, bezahlen einzeln und warten in der Schlange auf die
  naechste Waffel. Wer bis zum Ende der Pause keine mehr bekommen kann, stellt sich nicht an.
  Ein Waffeleisen: 6 mit Waffel, 18 ohne. Vier Waffeleisen: alle 24.
  Jede Waffel ist einzeln gezeichnet, in Stapeln zu zehn auf blauen Tellern. Die Teller
  stehen von Anfang an bereit.
  Die Bilder stammen aus der Pixel-Ansicht des Godot-Projekts "Prophecy of the Fallen Star"
  (Szene und Aufnahmeskript: kurse/ifk1-m/waffelstand/godot/) und sind als PNG eingebettet.
  DIESE DATEI WIRD ERZEUGT: Quelle ist kurse/ifk1-m/waffelstand/quelle.html, gebaut mit
  node kurse/ifk1-m/waffelstand/bauen.mjs. Nicht von Hand aendern.
  Eine Datei, kein Internet noetig, keine Bibliothek, keine Web-Fonts.
  Pruefen ohne Klicken: ?ansicht=backen|verkaufen|eisen&n=<Zahl>&t=<Zeit>&ende=1
  (n: Waffeln in "backen", Waffeleisen sonst; t: in "verkaufen" die Minute der Pause,
  in "backen" Sekunden seit dem Einstellen, in "eisen" die Minute des Backens)
-->

const TEIG_15 = 900, KOSTEN_15 = 6, PREIS = 1, MIN_JE_WAFFEL = 3;
const PAUSE = 20, KUNDEN = 24, JE_MIN = KUNDEN / PAUSE;      // 24 Personen in 20 Minuten
const BEDARF = 24;                                           // so viele Waffeln brauchen wir je Pause
const BACKZEITEN = [3, 6, 9, 12, 15, 18];                    // dann ist in der Pause eine Runde fertig
// Nur diese Anzahlen: Bei ihnen geht das Backen von 24 Waffeln in ganzen Runden auf.
const STUFEN = [1, 2, 3, 4, 6];

/* ---------------------------------------------------------------- Maße der Szene (wie in godot/waffle_stand.gd) */
const TISCH = 0.78;                                          // Höhe der Tischplatte
const EISEN_X = [-1.05, -0.60, -0.15, 0.30, 0.75, 1.20], EISEN_Z = -0.42;
const STAPEL_X = 0.7, STAPEL_SCHRITT = 0.30, STAPEL_Z = 0.38, DICKE = 0.045, TELLER = 0.02;
const BAECKER_Z = -1.0;
// Plätze der Teigschüsseln links auf dem Tisch; die erste steht neben der Person, die backt
const SCHUESSELN = [[-1.88, -0.36], [-1.50, -0.36], [-1.88, 0.03], [-1.50, 0.03], [-1.88, 0.42], [-1.50, 0.42]];
const JE_SCHUESSEL = 15;                                     // eine Schüssel ist ein Rezept: Teig für 15 Waffeln

/* ---------------------------------------------------------------- Bilder */
const M = DATEN.meta, B = {};
const cv = $("szene"), ctx = cv.getContext("2d");
// Das Bild aus Godot hat einen Pixel Rand auf jeder Seite; gezeigt wird 320 x 180.
const RAND = 1;
function laden() {
  const namen = Object.keys(DATEN.bilder);
  return Promise.all(namen.map(n => new Promise(fertig => {
    const im = new Image();
    im.onload = () => { B[n] = im; fertig(); };
    im.onerror = fertig;
    im.src = DATEN.bilder[n];
  })));
}
function bild(name, x, y) { if (B[name]) ctx.drawImage(B[name], Math.round(x) - RAND, Math.round(y) - RAND); }
function fest(name) { const s = M.sprites[name]; if (s) bild(name, s.x, s.y); }
// Weltpunkt (Meter; y ist die Höhe) -> Bildpunkt
function raum(x, y, z) {
  return [M.origin[0] + x * M.ex[0] + z * M.ez[0] + y * M.ey[0], M.origin[1] + x * M.ex[1] + z * M.ez[1] + y * M.ey[1]];
}
// Einzelbild mit seinem Fußpunkt auf einen Weltpunkt setzen
function setzen(name, x, y, z) {
  const s = M.sprites[name], p = raum(x, y, z);
  if (s) bild(name, p[0] + s.dx, p[1] + s.dy);
}
// Dampf über einem Waffeleisen (Platz 0 bis 5)
function dampf(platz, zeit) {
  const s = M.sprites["iron" + platz]; if (!s) return;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 3; i++) {
    const ph = (zeit * 0.9 + i * 0.37 + platz * 0.21) % 1;
    const x = s.x + 6 + i * 4 + Math.round(Math.sin((ph + i) * 6.3) * 1.5), y = s.y - 1 - Math.round(ph * 9);
    ctx.globalAlpha = 0.85 * (1 - ph);
    ctx.fillRect(x - RAND, y - RAND, 1 + (i % 2), 1);
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------- Teigschüsseln */
// teig: Teig für so viele Waffeln steht bereit; verbraucht: so viele Portionen sind schon im Eisen.
// Die Schüsseln werden der Reihe nach leer. Bild: 0 leer, 1 fast leer, 2 halb voll, 3 voll.
function schuesseln(teig, verbraucht) {
  const anzahl = Math.min(SCHUESSELN.length, Math.ceil(teig / JE_SCHUESSEL)), liste = [];
  for (let i = 0; i < anzahl; i++) {
    const anfangs = Math.min(JE_SCHUESSEL, teig - JE_SCHUESSEL * i);
    const rest = grenze(anfangs - Math.max(0, verbraucht - JE_SCHUESSEL * i), 0, JE_SCHUESSEL);
    liste.push({ x: SCHUESSELN[i][0], z: SCHUESSELN[i][1], bild: rest === 0 ? 0 : rest <= 5 ? 1 : rest <= 10 ? 2 : 3 });
  }
  liste.sort((a, b) => (a.x + a.z) - (b.x + b.z));               // hintere zuerst
  for (const k of liste) setzen("schuessel_" + k.bild, k.x, TISCH, k.z);
}

/* ---------------------------------------------------------------- Waffeln auf dem Tisch */
// Platz der Waffel Nummer j (ab 0): Stapel zu zehn, von der Kasse aus nach links
function waffelplatz(j) { return [STAPEL_X - Math.floor(j / 10) * STAPEL_SCHRITT, TISCH + TELLER + (j % 10) * DICKE, STAPEL_Z]; }
// Teller: einer je Zehnerstapel. Sie stehen von Anfang an bereit, so viele, wie für alle
// Waffeln nötig sind, die gebacken werden sollen.
function teller(waffelnGesamt) {
  for (let s = Math.ceil(waffelnGesamt / 10) - 1; s >= 0; s--) setzen("teller", STAPEL_X - s * STAPEL_SCHRITT, TISCH, STAPEL_Z);
}
function stapel(n) {
  for (let s = Math.floor((n - 1) / 10); s >= 0; s--) {          // hinterster Stapel zuerst
    for (let j = s * 10; j < Math.min(n, s * 10 + 10); j++) {
      const p = waffelplatz(j);
      setzen(j % 2 ? "waffel_b" : "waffel_a", p[0], p[1], p[2]);
    }
  }
}
// Waffel fliegt im Bogen vom Waffeleisen auf ihren Platz im Stapel (f von 0 bis 1)
function wurf(platz, ziel, f) {
  const a = [EISEN_X[platz], TISCH + 0.25, EISEN_Z], b = waffelplatz(ziel);
  setzen("waffel_a", a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f + Math.sin(f * Math.PI) * 0.5, a[2] + (b[2] - a[2]) * f);
}
// Die Person am Waffeleisen gibt es je Haltung, Platz und Anzahl der Waffeleisen als eigenes
// Bild: Sie steht schräg hinter den Eisen, die sie zum Teil verdecken.
const baecker = (haltung, platz, anzahl) => fest("baecker_" + haltung + "_" + platz + "_" + anzahl);

/* ---------------------------------------------------------------- Münze und Kreuz */
// Münze beim Bezahlen: fliegt im Bogen von der Hand in die offene Schublade der Kasse.
// f läuft von 0 (Hand) bis 1 (Schublade); danach blitzt sie kurz in der Schublade auf.
const HAND = [1.65, 0.95, 0.92], SCHUBLADE = [1.96, 0.86, 0.18];
function muenze(f) {
  const g = Math.min(f, 1);
  const p = raum(HAND[0] + (SCHUBLADE[0] - HAND[0]) * g, HAND[1] + (SCHUBLADE[1] - HAND[1]) * g + Math.sin(g * Math.PI) * 0.45,
                 HAND[2] + (SCHUBLADE[2] - HAND[2]) * g);
  const x = Math.round(p[0]) - RAND, y = Math.round(p[1]) - RAND;
  if (f <= 1) {
    ctx.fillStyle = "#5a3c10"; ctx.fillRect(x - 1, y - 2, 3, 5); ctx.fillRect(x - 2, y - 1, 5, 3);
    ctx.fillStyle = "#f6c832"; ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = "#fff6c0"; ctx.fillRect(x - 1, y - 1, 1, 1);
  } else {
    ctx.fillStyle = "#fff6c0"; ctx.fillRect(x - 2, y, 5, 1); ctx.fillRect(x, y - 2, 1, 5);
  }
}
// rotes Kreuz über einer Person, die ohne Waffel geht
function kreuz(x, z) {
  const p = raum(x, 1.75, z), cx = Math.round(p[0]) - RAND, cy = Math.round(p[1]) - RAND;
  ctx.fillStyle = "#B01A15";
  for (let i = -3; i <= 3; i++) {
    ctx.fillRect(cx + i, cy + i, 2, 1); ctx.fillRect(cx + i, cy - i, 2, 1);
  }
}

/* ---------------------------------------------------------------- Zustand */
const ANSICHTEN = ["backen", "verkaufen", "eisen"];
const frei = /eisen/i.test(location.search + location.hash);
// Verkaufen ist für die Klasse vorerst gesperrt (Knopf grau). Offen mit #verkaufen oder #eisen am Ende der Adresse.
const verkaufFrei = frei || /verkaufen/i.test(location.hash);
let ansicht = "backen";
let waffeln = 15;          // Backen
let standEisen = 1;        // Verkaufen: Waffeleisen am Stand (einstellbar nur mit #eisen)
let eisen = 1;             // Waffeleisen
let laeuft = false, t = 0, startzeit = 0, fertig = false;
let backBeginn = 0, backFest = null;   // Backen: Beginn des Stapelns, oder feste Zeit zum Prüfen
const versuche = new Map();
const eisenDauer = () => BEDARF * MIN_JE_WAFFEL / eisen;
const naechste = (wert, d) => STUFEN[grenze(STUFEN.indexOf(wert) + d, 0, STUFEN.length - 1)];

/* ---------------------------------------------------------------- Verkauf: Schlange und Backen */
const SEK_JE_MIN = 1;                    // eine Minute der Pause dauert eine Sekunde
// Bezahlen und Weggehen, in Minuten der Pause. Die Werte sind so gewählt, dass man bei einer
// Sekunde je Minute noch sieht, wie jemand stehen bleibt und bezahlt (0,3 s) und wie die
// Figuren gehen (2,5 m in der Sekunde). Bezahlen und Aufrücken zusammen müssen kürzer sein
// als der Abstand zwischen zwei Personen (20 / 24 Minuten), sonst staut es sich ohne Grund.
const ZAHLEN = 0.3;
// So lange vor Beginn der Pause läuft das Bild schon: Die ersten Personen kommen von außerhalb
// des Bildes und brauchen diese Zeit bis zur Kasse.
const VORLAUF = 3.4;
const TEMPO = 2.5, LUECKE = 0.55, SCHRITT = 0.4;   // Gehen in Metern je Minute, Abstand in der Schlange
// Die Schlange kommt von unten links: LANG_AN Meter vor der Kasse liegt der Fußpunkt außerhalb
// des Bildes. Wer geht, läuft nach unten rechts, bis die Figur ganz aus dem Bild ist.
const KASSE = [1.65, 1.15], LANG_AN = 8.0, AB = [0.995, 0.1];
// Ist eine Figur mit diesem Fußpunkt noch (teilweise) im Bild?
function imBild(x, z) { const p = raum(x, 0, z); return p[0] > -14 && p[0] < 352 && p[1] < 232; }
const bein = weg => 1 + Math.floor(Math.max(0, weg) / SCHRITT) % 2;       // Beinstellung 1 oder 2
let leute = [], vt = 0;                  // Personen der laufenden Pause und ihre Uhr

// Jede der 24 Personen hat ein eigenes Aussehen (kunde0 bis kunde23), niemand kommt doppelt vor.
// Legt für jede Person fest, ob und wann sie bezahlt (hängt nur von der Zahl der Waffeleisen ab).
function planen() {
  const gebacken = BACKZEITEN.length * standEisen;
  const fertigAb = j => BACKZEITEN[Math.floor(j / standEisen)];   // ab wann Waffel j auf dem Tisch liegt
  leute = []; vt = -VORLAUF;
  let platz = 0, kasseFrei = -9, letzte = null;
  for (let i = 0; i < KUNDEN; i++) {
    const an = (i + 1) / JE_MIN - ZAHLEN;                        // so käme sie ohne Schlange an die Kasse
    const p = { farbe: (i * 7 + 3) % 24, an, d: LANG_AN + 1, geht: false, mit: false };
    if (platz < gebacken) {
      const beginn = Math.max(an, kasseFrei + LUECKE / TEMPO, fertigAb(platz));
      if (beginn + ZAHLEN <= PAUSE + 1e-9) { p.mit = true; p.beginn = beginn; p.ende = beginn + ZAHLEN; p.vor = letzte; letzte = p; platz++; kasseFrei = p.ende; }
    }
    if (!p.mit) {
      // bleibt hinter dem Ende der Schlange stehen und dreht um
      const wartend = leute.filter(q => q.mit && q.an <= an && q.ende > an).length;
      p.halt = wartend * LUECKE + 0.9;
      p.um = an - p.halt / TEMPO;
    }
    leute.push(p);
  }
}
// Rückt alle Personen um dt Minuten weiter.
function ruecken(dt) {
  vt += dt;
  for (const p of leute) {
    if (!p.mit) continue;
    const freiweg = Math.max(0, (p.an - vt) * TEMPO);            // Abstand zur Kasse ohne Schlange
    const hinterVor = p.vor && vt < p.vor.ende ? p.vor.d + LUECKE : 0;
    const ziel = Math.max(freiweg, hinterVor), alt = p.d;
    if (vt >= p.beginn) p.d = 0;
    else if (alt > LANG_AN) p.d = ziel;                          // noch außerhalb des Bildes
    else p.d = Math.max(ziel, alt - TEMPO * 1.6 * dt);
    p.geht = p.d < alt - 1e-6 && alt <= LANG_AN;
  }
}
function spulen(bis) { planen(); while (vt < bis - 1e-9) ruecken(Math.min(0.02, bis - vt)); }
// Was gerade zu sehen ist: Liste der Figuren, von hinten nach vorn sortiert
function figuren() {
  const liste = [];
  for (const p of leute) {
    const vorn = "kunde" + p.farbe;
    if (p.mit) {
      if (vt >= p.ende) {
        const weit = (vt - p.ende) * TEMPO, x = KASSE[0] + weit * AB[0], z = KASSE[1] + weit * AB[1];
        if (!imBild(x, z)) continue;
        liste.push({ name: vorn + "_froh_" + bein(weit), x, z, zahlt: vt - p.ende < 0.1 ? 1.2 : null });
      } else if (p.d <= LANG_AN) {
        liste.push({ name: vorn + "_kommt_" + (p.geht ? bein(LANG_AN - p.d) : 0), x: KASSE[0], z: KASSE[1] + p.d,
                     zahlt: vt >= p.beginn ? (vt - p.beginn) / ZAHLEN : null });
      }
    } else if (vt < p.um) {
      const d = (p.an - vt) * TEMPO; if (d > LANG_AN) continue;
      liste.push({ name: vorn + "_kommt_" + bein(LANG_AN - d), x: KASSE[0], z: KASSE[1] + d });
    } else {
      const weit = (vt - p.um) * TEMPO, x = KASSE[0] + weit, z = KASSE[1] + p.halt + weit * 0.12;
      if (!imBild(x, z)) continue;
      liste.push({ name: vorn + "_leer_" + bein(weit), x, z, leer: true });
    }
  }
  return liste.sort((a, b) => (a.x + a.z) - (b.x + b.z));
}
// Zahlen zur Uhrzeit zeit: Personen mit und ohne Waffel, Waffeln auf dem Tisch
function verkauf(zeit) {
  const mit = leute.filter(p => p.mit && p.ende <= zeit + 1e-9).length;
  const ohne = leute.filter(p => !p.mit && p.um <= zeit + 1e-9).length;
  const gebacken = BACKZEITEN.filter(b => b <= zeit + 1e-9).length * standEisen;
  return { mit, ohne, rest: gebacken - mit };
}

/* ---------------------------------------------------------------- Zeichnen */
function zeichnen(jetzt) {
  const zeit = (jetzt || 0) / 1000;
  // Backen und Waffeleisen: näher heran. Die Zeichenfläche zeigt dann nur den Ausschnitt mit Tischen und Personen
  // (208 x 117 Bildpunkte ab x = 73), die Seite vergrößert ihn auf die volle Breite.
  const nah = ansicht === "backen" || ansicht === "eisen", breite = nah ? 208 : 320, hoehe = nah ? 117 : 180;
  if (cv.width !== breite || cv.height !== hoehe) { cv.width = breite; cv.height = hoehe; }
  ctx.setTransform(1, 0, 0, 1, nah ? -73 : 0, 0);
  ctx.imageSmoothingEnabled = false;
  bild("plate", 0, 0);
  if (ansicht === "backen") {
    // Die Waffeln entstehen eine nach der anderen, bis die eingestellte Anzahl auf dem Tisch liegt.
    const dauer = backFest !== null ? backFest : (jetzt - backBeginn) / 1000;
    const tempo = Math.max(1.6, waffeln / 8), takt = grenze(1 / tempo, 0.35, 0.62);
    const da = Math.min(waffeln, Math.floor(tempo * Math.max(0, dauer)));
    const ph = (dauer / takt) % 1, backt = da < waffeln;
    schuesseln(waffeln, backt && ph < 0.4 ? da : Math.min(waffeln, da + (backt ? 1 : 0)));
    fest("iron0"); if (backt) dampf(0, zeit);
    teller(waffeln); stapel(da);
    baecker(!backt ? "ruhe" : ph < 0.4 ? "giesst" : ph < 0.55 ? "ruhe" : ph < 0.85 ? "nimmt" : "ruhe", 0, 1);
    if (backt && ph >= 0.78) wurf(0, da, (ph - 0.78) / 0.22);
  } else if (ansicht === "verkaufen") {
    // Jedes Waffeleisen bäckt Runde um Runde: einfüllen, 3 Minuten warten, herausnehmen.
    const n = standEisen, backt = laeuft && t >= 0 && t < BACKZEITEN[BACKZEITEN.length - 1];
    const ph = backt ? (t % MIN_JE_WAFFEL) / MIN_JE_WAFFEL : 0, v = verkauf(t);
    const runden = t <= 0 ? 0 : Math.min(BACKZEITEN.length, Math.floor(t / MIN_JE_WAFFEL + 1e-9) + 1);
    schuesseln(Math.ceil(BACKZEITEN.length * n / JE_SCHUESSEL) * JE_SCHUESSEL, n * runden);
    for (let i = 0; i < n; i++) { fest("iron" + i); if (backt) dampf(i, zeit); }
    teller(BACKZEITEN.length * n); stapel(v.rest);
    if (backt && ph < 0.24) {
      baecker("giesst", Math.min(n - 1, Math.floor(ph / 0.24 * n)), n);
    } else if (backt && ph > 0.76) {
      const teil = (ph - 0.76) / 0.24 * n, platz = Math.min(n - 1, Math.floor(teil));
      baecker("nimmt", platz, n);
      if (teil - platz > 0.45) wurf(platz, v.rest + platz, (teil - platz - 0.45) / 0.55);
    } else baecker("ruhe", backt ? n - 1 : 0, n);
    const liste = figuren();
    for (const k of liste) { setzen(k.name, k.x, 0, k.z); if (k.leer) kreuz(k.x, k.z); }
    for (const k of liste) if (k.zahlt != null) muenze(k.zahlt);
  } else {
    const da = Math.min(BEDARF, eisen * Math.floor(t / MIN_JE_WAFFEL + 1e-9));
    schuesseln(Math.ceil(BEDARF / JE_SCHUESSEL) * JE_SCHUESSEL, t <= 0 ? 0 : Math.min(BEDARF, eisen * (Math.floor(t / MIN_JE_WAFFEL + 1e-9) + (laeuft ? 1 : 0))));
    for (let i = 0; i < eisen; i++) { fest("iron" + i); if (laeuft) dampf(i, zeit); }
    teller(BEDARF); stapel(da);
    if (laeuft) {
      // Die Person geht von Waffeleisen zu Waffeleisen: einfüllen, herausnehmen, auf den Stapel legen
      const takt = 0.5, runde = Math.floor(zeit / takt), ph = (zeit / takt) % 1;
      const platz = runde % eisen;
      baecker(ph < 0.2 ? "ruhe" : ph < 0.55 ? "giesst" : ph < 0.85 ? "nimmt" : "ruhe", platz, eisen);
      if (ph >= 0.78 && da < BEDARF) wurf(platz, da, (ph - 0.78) / 0.22);
    } else baecker("ruhe", 0, eisen);
  }
}

/* ---------------------------------------------------------------- Anzeigen */
function kachel(zahl, name, art) { return '<div class="' + (art || "") + '"><b>' + zahl + "</b><span>" + name + "</span></div>"; }
function anzeigen() {
  ANSICHTEN.forEach(a => $("tab-" + a).setAttribute("aria-pressed", a === ansicht ? "true" : "false"));
  $("start").hidden = ansicht === "backen";
  $("start").disabled = laeuft;
  // Pause beenden: bricht die laufende Pause ab und stellt den Stand auf den Anfang zurück
  $("ende").hidden = ansicht !== "verkaufen"; $("ende").disabled = !laeuft;
  $("frage").hidden = ansicht === "verkaufen";
  $("minus").disabled = $("plus").disabled = laeuft;
  $("regler").hidden = ansicht === "verkaufen" && !frei;
  $("versuche").hidden = ansicht !== "eisen" || versuche.size === 0;
  $("uhr").hidden = ansicht !== "verkaufen";
  let satz = "";
  if (ansicht === "backen") {
    const k = waffeln / 15;
    $("frage").textContent = "Wie viele Waffeln backen wir?";
    $("wert").textContent = waffeln; $("wert-name").textContent = "Waffeln";
    $("zahlen").innerHTML = kachel(TEIG_15 * k + " g", "Teig");
  } else if (ansicht === "verkaufen") {
    const v = verkauf(t), noch = grenze(Math.ceil(PAUSE - t - 1e-9), 0, PAUSE);
    $("frage").textContent = "";
    $("wert").textContent = standEisen; $("wert-name").textContent = "Waffeleisen";
    $("start").textContent = "Pause starten";
    // Restzeit der Pause als mm:ss; die Sekunden springen in Viertelminuten, sonst flimmern sie
    const rest = grenze(PAUSE - t, 0, PAUSE), ganz = Math.floor(rest + 1e-9), viertel = Math.floor((rest - ganz) * 4 + 1e-9) * 15;
    $("uhr-zahl").textContent = String(ganz).padStart(2, "0") + ":" + String(viertel).padStart(2, "0");
    $("uhr").setAttribute("aria-label", "Noch " + noch + " Minuten bis zum Ende der Pause");
    $("uhr-mit").textContent = v.mit; $("uhr-ohne").textContent = v.ohne; $("uhr-rest").textContent = v.rest;
    $("zahlen").innerHTML = "";
    if (fertig) {
      if (v.mit < KUNDEN) satz = v.mit + " Personen bekommen eine Waffel. " + v.ohne + " Personen gehen ohne Waffel.";
      else if (v.rest === 0) satz = "Alle 24 Personen bekommen eine Waffel.";
      else satz = "Alle 24 Personen bekommen eine Waffel. " + v.rest + " Waffeln bleiben übrig.";
    }
  } else {
    const da = Math.min(BEDARF, eisen * Math.floor(t / MIN_JE_WAFFEL + 1e-9));
    $("frage").textContent = "Wir backen 24 Waffeln. Wie viele Waffeleisen nehmen wir?";
    $("wert").textContent = eisen; $("wert-name").textContent = "Waffeleisen";
    $("start").textContent = "Backen starten";
    $("zahlen").innerHTML = kachel(Math.floor(t), "Minute") + kachel(da, "fertige Waffeln");
    if (fertig) satz = "Mit " + eisen + " Waffeleisen dauert das Backen " + eisenDauer() + " Minuten.";
    $("versuche-zeilen").innerHTML = [...versuche.entries()].sort((a, b) => a[0] - b[0])
      .map(([n, d]) => "<tr><td>" + n + "</td><td>" + d + " min</td></tr>").join("");
  }
  $("satz").textContent = satz;
  $("kontrolle").hidden = !(ansicht === "verkaufen" && fertig && $("geld").hidden);
  if (!(ansicht === "verkaufen" && fertig)) $("geld").hidden = true;
}

/* ---------------------------------------------------------------- Ablauf */
function zurueck() { planen(); laeuft = false; t = 0; fertig = false; $("geld").hidden = true; backBeginn = performance.now(); backFest = null; }
function waehlen(name) {
  if (name === "eisen" && !frei) name = "backen";
  if (name === "verkaufen" && !verkaufFrei) name = "backen";
  ansicht = name; zurueck(); anzeigen();
}
function stellen(d) {
  if (laeuft) return;
  if (ansicht === "backen") waffeln = grenze(waffeln + 15 * d, 15, 60);
  else if (ansicht === "verkaufen") { if (frei) standEisen = naechste(standEisen, d); }
  else eisen = naechste(eisen, d);
  zurueck(); anzeigen();
}
function starten() { zurueck(); laeuft = true; startzeit = performance.now(); anzeigen(); }
function schritt(jetzt) {
  if (laeuft) {
    const sek = (jetzt - startzeit) / 1000;
    if (ansicht === "verkaufen") {
      // Das Bild läuft schon kurz vor der Pause (die ersten kommen herein) und danach weiter, bis
      // die letzten aus dem Bild gegangen sind. Das Ergebnis steht fest, sobald die Pause um ist.
      t = sek / SEK_JE_MIN - VORLAUF;
      while (vt < t - 1e-9) ruecken(Math.min(0.02, t - vt));
      fertig = t >= PAUSE;
      if (t > PAUSE && figuren().length === 0) laeuft = false;
    } else if (ansicht === "eisen") {
      t = sek * 12;                                              // 12 Minuten je Sekunde
      if (t >= eisenDauer()) { t = eisenDauer(); laeuft = false; fertig = true; versuche.set(eisen, eisenDauer()); }
    }
    anzeigen();
  }
  zeichnen(jetzt);
  requestAnimationFrame(schritt);
}
// Kosten: Teig gibt es nur in ganzen Rezepten zu 15 Waffeln.
function kontrolle() {
  const v = verkauf(PAUSE), gebacken = BACKZEITEN.length * standEisen, rezepte = Math.ceil(gebacken / 15);
  const erloes = v.mit * PREIS, kosten = rezepte * KOSTEN_15;
  $("geld").innerHTML = kachel(euro(erloes), "Erlös") + kachel(euro(kosten), "Kosten: Teig für " + rezepte * 15 + " Waffeln") + kachel(euro(erloes - kosten), "Gewinn");
  $("geld").hidden = false; $("kontrolle").hidden = true;
}

$("tab-eisen").hidden = !frei;
$("tab-verkaufen").disabled = !verkaufFrei;
ANSICHTEN.forEach(a => $("tab-" + a).addEventListener("click", () => waehlen(a)));
$("minus").addEventListener("click", () => stellen(-1));
$("plus").addEventListener("click", () => stellen(1));
$("start").addEventListener("click", starten);
$("ende").addEventListener("click", () => { zurueck(); anzeigen(); });
$("kontrolle").addEventListener("click", kontrolle);

laden().then(() => {
  const q = new URLSearchParams(location.search), a = q.get("ansicht"), n = +q.get("n");
  if (a) waehlen(a); else zurueck();
  const stufe = STUFEN.includes(n) ? n : 1;
  if (n) {
    if (ansicht === "backen") waffeln = grenze(n, 15, 60);
    else if (ansicht === "verkaufen") standEisen = frei ? stufe : 1;
    else eisen = stufe;
  }
  planen();
  if (q.get("t")) { if (ansicht === "backen") backFest = +q.get("t"); else t = +q.get("t"); }
  if (q.get("ende")) {
    fertig = true;
    if (ansicht === "backen") backFest = 1000;
    if (ansicht === "verkaufen") t = PAUSE + 8;
    if (ansicht === "eisen") { for (const s of STUFEN) if (s <= eisen) versuche.set(s, BEDARF * MIN_JE_WAFFEL / s); t = eisenDauer(); }
  }
  if (ansicht === "verkaufen" && q.get("t") || (ansicht === "verkaufen" && q.get("ende"))) { spulen(t); laeuft = false; }
  anzeigen();
  if (q.get("ende") && ansicht === "verkaufen") kontrolle();
  requestAnimationFrame(schritt);
});
// QR-Code im Kopf: antippen vergrößert ihn für die Projektion, noch einmal antippen verkleinert ihn
$("qr").addEventListener("click", () => {
  const gross = $("qr").classList.toggle("gross");
  $("qr").setAttribute("aria-expanded", gross);
});
